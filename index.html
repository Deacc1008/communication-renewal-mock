function Dash(){let active=DB.subs.filter(s=>s.status=="Active"&&!s.renewed).length,exp=DB.subs.filter(s=>s.status=="Active"&&!s.renewed&&days(DB.TODAY,s.end)>=0&&days(DB.TODAY,s.end)<=7).length;return `<div class="crumb">KDK Licensing Application / Communication</div><div class="head"><div><h1>Communication Dashboard</h1><p>Renewal operations, campaign performance and execution readiness.</p></div><button class="btn primary" onclick="openCamp()">＋ Create Campaign</button></div><div class="grid kpis"><div class="card kpi"><span class="ico">▣</span><span class="label muted">Active Plans</span><div class="value">${active}</div><span class="muted">Live Subscription Master data</span></div><div class="card kpi"><span class="ico">◷</span><span class="label muted">Expiring in 7 Days</span><div class="value">${exp}</div><span class="muted">Current eligible subscriptions</span></div><div class="card kpi"><span class="ico">↗</span><span class="label muted">Messages Triggered</span><div class="value">${284+DB.msg.length}</div><span class="muted"><b class="ok">96.4%</b> provider delivery rate</span></div><div class="card kpi"><span class="ico">✓</span><span class="label muted">Renewals Attributed</span><div class="value">${38+DB.subs.filter(s=>s.renewed).length}</div><span class="muted"><b class="ok">+12</b> this cycle</span></div></div><div class="grid two" style="margin-top:15px"><section class="card panel"><div class="title"><h3>Communication Performance</h3><span class="muted">WhatsApp + Email</span></div><div class="chart">${[64,71,58,82,76,93,88].map((v,i)=>`<div class="barcol"><div class="bars"><i class="bar" style="height:${v}%"></i><i class="bar email" style="height:${v-18}%"></i></div>${["Apr","May","Jun","Jul","Aug","Sep","Oct"][i]}</div>`).join("")}</div></section><section class="card panel"><div class="title"><h3>Renewal Funnel</h3><span class="muted">Current cycle</span></div>${[["Expiring audience",1284,100],["Delivered",1120,87],["Engaged",714,56],["Renewed",386,30]].map(x=>`<div class="funnel"><div class="frow"><b>${x[0]}</b><span>${x[1]}</span></div><div class="progress"><i style="width:${x[2]}%"></i></div></div>`).join("")}</section></div><div class="grid two" style="margin-top:15px"><section class="card panel"><div class="title"><h3>Upcoming Renewal Triggers</h3><button class="btn small" onclick="nav('scheduler')">View Scheduler</button></div>${schedule()}</section><section class="card panel"><div class="title"><h3>Campaign Activity</h3><button class="btn small" onclick="nav('campaigns')">Manage</button></div><table class="table"><tr><th>Campaign</th><th>Status</th><th>Triggers</th></tr>${DB.campaigns.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td><span class="badge g">${c.status}</span></td><td>${c.triggers.map(t=>t?t+"d":"Expiry").join(" · ")}</td></tr>`).join("")}</table></section></div>`}
function Templates(){let t=DB.templates.find(x=>x.id==DB.template),list=DB.templates.filter(x=>x.type==t.type);let preview=t.type=="WhatsApp"?`<div class="phone"><div class="phonehead">KDK Support · WhatsApp</div><div class="bubble">${esc(t.text).replace(/{{1}}/g,"Aarav").replace(/{{2}}/g,"Spectrum Cloud Professional").replace(/{{3}}/g,"23 Sep 2026").replace(/{{4}}/g,"7")}</div></div>`:`<div class="callout"><b>${esc(t.subject)}</b><hr>${esc(t.text).replace(/{{1}}/g,"Aarav").replace(/{{2}}/g,"PDF Signer Business").replace(/{{3}}/g,"25 Sep 2026")}</div>`;return `<div class="crumb">KDK Licensing Application / Communication / Templates</div><div class="head"><div><h1>Template Master</h1><p>Approved Meta templates and ZeptoMail email templates.</p></div><button class="btn primary" onclick="toast('New template workflow opened')">＋ New Template</button></div><div class="tabs"><button class="${t.type=="WhatsApp"?"on":""}" onclick="type('WhatsApp')">WhatsApp Templates</button><button class="${t.type=="Email"?"on":""}" onclick="type('Email')">Email Templates</button></div><div class="layout"><section class="card list"><input class="search" placeholder="Search templates..." oninput="filter(this.value)"><div id="items">${list.map(x=>`<div class="item ${x.id==t.id?"sel":""}" onclick="DB.template=${x.id};render()"><b>${esc(x.name)}</b><small>${x.product} · <span class="badge g">Approved</span></small></div>`).join("")}</div></section><section class="card editor"><div class="title"><h3>${esc(t.name)}</h3><span class="muted">${t.product} · Approved</span></div><div class="field"><label>Template Name</label><input value="${esc(t.name)}"></div><div class="field"><label>Content</label><textarea style="width:100%;min-height:110px">${esc(t.text)}</textarea></div><div class="callout"><b>Provider:</b> ${t.type=="WhatsApp"?"Rampwin API → Meta approved template":"ZeptoMail → Email template"}<br><span class="muted">Provider callbacks are simulated.</span></div></section><aside class="card preview"><div class="title"><h3>Live Preview</h3></div>${preview}</aside></div>`}
function Campaigns(){return `<div class="crumb">KDK Licensing Application / Communication / Campaigns</div><div class="head"><div><h1>Campaign Manager</h1><p>One renewal campaign with multiple Plan End Date trigger points.</p></div><button class="btn primary" onclick="openCamp()">＋ Create Campaign</button></div><section class="card panel"><table class="table"><tr><th>Campaign</th><th>Audience</th><th>Triggers</th><th>Channels</th><th>Eligible</th><th>Status</th><th></th></tr>${DB.campaigns.map(c=>`<tr><td><b>${esc(c.name)}</b><div class="muted">${c.products.join(", ")}</div></td><td>Subscription Master</td><td>${c.triggers.map(t=>`<span class="badge b">${t?t+"d":"Expiry"}</span>`).join(" ")}</td><td>${c.channels.join(" + ")}</td><td><b>${DB.subs.filter(s=>c.products.includes(s.product)&&s.status=="Active"&&!s.renewed).length}</b></td><td><span class="badge g">${c.status}</span></td><td><button class="btn small" onclick="clone(${c.id})">Clone</button></td></tr>`).join("")}</table></section>`}
function Scheduler(){return `<div class="crumb">KDK Licensing Application / Communication / Scheduler</div><div class="head"><div><h1>Scheduler</h1><p>Projected counts are recalculated from each subscription's Plan End Date.</p></div><button class="btn primary" onclick="run()">▶ Run Scheduler Now</button></div><section class="card panel">${scheduleFull()}</section><div class="grid two" style="margin-top:15px"><section class="card panel"><h3>Protocol</h3><p class="muted" style="font-size:11px;line-height:1.7">This is not a daily/every-alternate-day broadcast. A single campaign can contain 15/7/3/1-day and On Expiry triggers. Each subscription gets its own trigger dates.</p></section><section class="card panel"><h3>Stop Conditions</h3><p style="font-size:11px">✓ Stop when subscription is renewed<br>✓ Stop at Plan End Date<br>✓ No post-expiry messages unless configured</p></section></div>`}
function scheduleFull(){let r=scheduleRows();return `<table class="table"><tr><th>Execution Date</th><th>Trigger</th><th>Campaign</th><th>Eligible</th><th>WhatsApp</th><th>Email</th><th>State</th></tr>${r.map(x=>{let e=x.s.filter(s=>s.status=="Active"&&!s.renewed),w=e.filter(s=>s.waOpt).length,m=e.filter(s=>s.emailOpt).length;return `<tr><td><b>${fmt(x.d)}</b></td><td><span class="badge b">${x.t?x.t+" Days Before":"On Plan End Date"}</span></td><td>${esc(x.c.name)}</td><td><b>${e.length}</b></td><td><span class="badge g">${w}</span></td><td><span class="badge b">${m}</span></td><td><span class="badge ${x.d==DB.TODAY?"a":"gray"}">${x.d==DB.TODAY?"Due Today":"Scheduled"}</span></td></tr>`}).join("")||`<tr><td colspan="7" class="muted" style="padding:35px;text-align:center">No upcoming executions.</td></tr>`}</table>`}
function History(){let a=[{d:"16 Sep 2026",c:"September Renewal Journey",ch:"WhatsApp",n:84,s:"Delivered"},{d:"16 Sep 2026",c:"September Renewal Journey",ch:"Email",n:72,s:"Opened"},{d:"09 Sep 2026",c:"August Renewal Campaign",ch:"WhatsApp",n:126,s:"Delivered"},...DB.msg];return `<div class="crumb">KDK Licensing Application / Communication / History</div><div class="head"><div><h1>Audit Logs & History</h1><p>Campaign execution history and simulated provider responses.</p></div><button class="btn" onclick="toast('CSV export prepared for demo')">⇩ Export CSV</button></div><section class="card panel"><table class="table"><tr><th>Date</th><th>Campaign</th><th>Channel</th><th>Count</th><th>Status</th><th>Action</th></tr>${a.map(x=>`<tr><td>${x.d}</td><td><b>${esc(x.c)}</b></td><td><span class="badge ${x.ch=="WhatsApp"?"g":"b"}">${x.ch}</span></td><td>${x.n}</td><td><span class="badge g">${x.s}</span></td><td><button class="btn small" onclick="toast('Audit details opened')">Details</button></td></tr>`).join("")}</table></section>`}
function openCamp(c){DB.modal={c:c||{name:"September Renewal Journey — Clone",products:["Spectrum","ExpressGST","ZenTDS","PDF Signer"],triggers:[7,3],channels:["WhatsApp","Email"],time:"10:00"}};render()}
function CM(){if(!DB.modal?.c)return"";let c=DB.modal.c,cur=DB.subs.filter(s=>c.products.includes(s.product)&&s.status=="Active"&&!s.renewed).length;return `<div class="modalbg"><div class="modal"><div class="head"><div><h2>${esc(c.name)}</h2><p>Single campaign · multiple renewal trigger points</p></div><button class="btn" onclick="DB.modal=null;render()">×</button></div><div class="wizard"><div class="step on">1 Audience</div><div class="step on">2 Renewal Schedule</div><div class="step on">3 Message & Channels</div><div class="step">4 Review</div></div><div class="field"><label>Campaign Name</label><input id="cn" value="${esc(c.name)}"></div><div class="field"><label>Products from Subscription Master</label><div class="channels">${products.map(p=>`<label class="channel ${c.products.includes(p)?"on":""}"><input type="checkbox" ${c.products.includes(p)?"checked":""} onchange="tp('${p}',this.checked)"> <b>${p}</b></label>`).join("")}</div></div><div class="field"><label>When should we send renewal reminders?</label><div class="triggers">${[15,7,3,1,0].map(t=>`<label class="check ${c.triggers.includes(t)?"on":""}"><input type="checkbox" ${c.triggers.includes(t)?"checked":""} onchange="tt(${t},this.checked)"> <b>${t?t+" Days Before Expiry":"On Plan End Date"}</b><small>${count(c,t)} currently eligible</small></label>`).join("")}</div></div><div class="field"><label>Send Through</label><div class="channels">${["WhatsApp","Email"].map(ch=>`<label class="channel ${c.channels.includes(ch)?"on":""}"><input type="checkbox" ${c.channels.includes(ch)?"checked":""} onchange="tc('${ch}',this.checked)"> <b>${ch}</b><small>${ch=="WhatsApp"?"Rampwin + Meta approved template":"ZeptoMail + email template"}</small></label>`).join("")}</div></div><div class="callout"><b>Current eligible audience: ${cur}</b><br>Eligibility is recalculated at every trigger. If a customer renews after the 7-day reminder, they are automatically excluded from the 3-day reminder.</div><div class="actions"><button class="btn" onclick="DB.modal=null;render()">Cancel</button><button class="btn primary" onclick="save()">Save & Schedule Campaign</button></div></div></div>`}
function count(c,t){return DB.subs.filter(s=>c.products.includes(s.product)&&eligible(s,t)).length}function tp(p,on){let c=DB.modal.c;if(on&&!c.products.includes(p))c.products.push(p);if(!on)c.products=c.products.filter(x=>x!=p);render()}function tt(t,on){let c=DB.modal.c;if(on&&!c.triggers.includes(t))c.triggers.push(t);if(!on)c.triggers=c.triggers.filter(x=>x!=t);render()}function tc(ch,on){let c=DB.modal.c;if(on&&!c.channels.includes(ch))c.channels.push(ch);if(!on)c.channels=c.channels.filter(x=>x!=ch);render()}function save(){let c=DB.modal.c;c.name=document.getElementById("cn").value||"Renewal Campaign";c.id=Date.now();c.status="Scheduled";DB.campaigns.push({...c});DB.modal=null;DB.view="campaigns";toast("Campaign saved and scheduled")}function clone(id){let c=DB.campaigns.find(x=>x.id==id);openCamp({...c,id:0,name:c.name+" — Clone",products:[...c.products],triggers:[...c.triggers],channels:[...c.channels]})}
function run(){let n=0;DB.campaigns.forEach(c=>c.triggers.forEach(t=>DB.subs.filter(s=>c.products.includes(s.product)&&eligible(s,t)).forEach(s=>{n++;DB.msg.push({d:fmt(DB.TODAY),c:c.name,ch:c.channels[0],n:1,s:"Delivered"})})));toast(n?`Scheduler executed: ${n} eligible events processed`:"No eligible events today")}
function type(t){DB.template=DB.templates.find(x=>x.type==t).id;render()}function filter(q){document.querySelectorAll(".item").forEach(x=>x.style.display=x.innerText.toLowerCase().includes(q.toLowerCase())?"block":"none")}
function sim(){DB.modal={sim:1};render()}function SM(){if(!DB.modal?.sim)return"";return `<div class="modalbg"><div class="modal"><h2>Prototype Controls</h2><p>Simulated backend controls for demonstrating the renewal protocol.</p><div class="field"><label>Simulated Current Date</label><input id="sd" type="date" value="${DB.TODAY}"></div><div class="field"><label>Mark customer as renewed</label><div class="channels">${DB.subs.filter(s=>s.status=="Active"&&!s.renewed).slice(0,20).map(s=>`<button class="btn small" onclick="renew(${s.id})">${esc(s.name)} · ${s.product}</button>`).join("")}</div></div><div class="callout"><b>Demo:</b> set a trigger date, run Scheduler, then renew a customer. Their future trigger eligibility disappears.</div><div class="actions"><button class="btn" onclick="DB.modal=null;render()">Close</button><button class="btn primary" onclick="DB.TODAY=document.getElementById('sd').value;DB.modal=null;render()">Apply Date</button></div></div></div>`}function renew(id){let s=DB.subs.find(x=>x.id==id);s.renewed=true;s.status="Renewed";toast(`${s.name} renewed — future reminders skipped`)}
function render(){let b=DB.view=="dashboard"?Dash():DB.view=="templates"?Templates():DB.view=="campaigns"?Campaigns():DB.view=="scheduler"?Scheduler():History();document.getElementById("app").innerHTML=Header()+`<main class="main">${b}</main>`+(DB.modal?.sim?SM():DB.modal?CM():"")+(DB.t?`<div class="toast">${esc(DB.t)}</div>`:"")}render();
</script></body></html>
